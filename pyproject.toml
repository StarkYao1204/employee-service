[project]
name = "employee-agent-service"
version = "0.1.0"
description = "持久化多 Agent SSE API：登录认证、多会话历史与可恢复状态"
readme = "README.md"
authors = [
    { name = "flyfish1204", email = "yaoxuechen2004@163.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.165.0",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "onnxruntime>=1.32.0",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "pymupdf>=2.1",
    "pymysql>=1.2.4",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rapidocr>=3.10.0",
    "sqlalchemy>=2.1.9",
    "release_guard",
]


[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "app"
module-root = ""


[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true


[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "security" },
]
lint = [
    "mypy>=1.15,<2.0",
    "ruff>=0.11,<1.0",
]
security = [
    "detect-secrets>=1.5,<2.0",
]
test = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
]


[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: 需要数据库或其他外部服务的集成测试",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true


[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
release-guard = { workspace = true }